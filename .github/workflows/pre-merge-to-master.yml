name: Pre-merge to master

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]

jobs:
  lint-repository:
    name: Lint repository
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run repository checks
        run: |
          nix develop path:./.nix -c .dev/scripts/check.sh

  discover-images:
    name: Discover images
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.collect.outputs.matrix }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Collect image metadata
        id: collect
        run: |
          set -euo pipefail

          mapfile -t dockerfiles < <(find images -type f -name 'Dockerfile' -print | sort)
          if [ "${#dockerfiles[@]}" -eq 0 ]; then
            echo 'matrix=[]' >>"$GITHUB_OUTPUT"
            exit 0
          fi

          matrix_json=$(
            for dockerfile in "${dockerfiles[@]}"; do
              [ -z "${dockerfile}" ] && continue
              context=$(dirname "${dockerfile}")
              name=$(basename "${context}")
              jq -nc \
                --arg name "${name}" --arg context "${context}" --arg file "${dockerfile}" \
                '{name: $name, context: $context, file: $file}'
            done | jq -sc '.'
          )

          echo "Discovered matrix: ${matrix_json}"
          echo "matrix=${matrix_json}" >>"$GITHUB_OUTPUT"

  build-images:
    name: Build ${{ matrix.image.name }} image
    needs: discover-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    strategy:
      matrix:
        image: ${{ fromJson(needs.discover-images.outputs.matrix) }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.image.name }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          push: false
          provenance: false
          cache-from: type=gha,scope=${{ github.workflow }}-${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ github.workflow }}-${{ matrix.image.name }},mode=max

  report-build-status:
    name: Report image build status
    needs: build-images
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report build status
        run: |
          result='${{ needs.build-images.result }}'
          level="notice"

          if [ "${result}" != "success" ]; then
            level="error"
          fi

          echo "::${level}::Image build job outcome: ${result}"
          if [ "${result}" != "success" ]; then
            exit 1
          fi
